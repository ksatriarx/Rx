<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rx! Admin — Kelola Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111; --paper:#f2ede0; --paper-2:#e8e0c8; --yellow:#ffe14d;
  --red:#ff4757; --green:#06d6a0; --blue:#29b6f6; --white:#fffdf7;
  --border:3px solid var(--ink); --shadow:4px 4px 0 var(--ink);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login-box{background:var(--white);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:40px 36px;width:min(400px,100%);text-align:center;transform:rotate(-1deg)}
.brand-big{font-family:'Bungee',sans-serif;font-size:44px;background:var(--ink);color:var(--yellow);display:inline-block;padding:10px 22px 6px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red);margin-bottom:20px;transform:rotate(-3deg)}
.brand-big span{color:var(--red)}
.login-box h2{font-family:'Bungee',sans-serif;font-size:16px;letter-spacing:.15em;margin-bottom:24px;color:#666}
.login-box input{width:100%;padding:14px 16px;border:3px solid var(--ink);background:var(--paper);font-family:inherit;font-size:16px;margin-bottom:16px;outline:none;box-shadow:3px 3px 0 var(--ink)}
.login-box input:focus{box-shadow:3px 3px 0 var(--yellow)}
.login-box button{width:100%;padding:14px;background:var(--yellow);border:3px solid var(--ink);font-family:'Bungee',sans-serif;font-size:14px;letter-spacing:.08em;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:.15s}
.login-box button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.login-box button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.hint{font-size:12px;color:#888;margin-top:16px}
.hint code{background:var(--paper-2);padding:2px 6px;border-radius:3px;font-weight:700}

/* HEADER */
.admin-header{background:var(--paper);border-bottom:3px solid var(--ink);padding:16px 5vw;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.brand-sm{font-family:'Bungee',sans-serif;font-size:22px;background:var(--ink);color:var(--yellow);padding:6px 14px 3px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--red);transform:rotate(-2deg)}
.brand-sm span{color:var(--red)}
.divider{font-family:'Bungee',sans-serif;font-size:20px;color:#999}
.subtitle{font-family:'Bungee',sans-serif;font-size:13px;letter-spacing:.1em;color:#666}
.header-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.btn{font-family:'Bungee',sans-serif;font-size:12px;letter-spacing:.05em;padding:11px 18px 8px;border:var(--border);box-shadow:var(--shadow);cursor:pointer;transition:.15s;background:var(--white);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn-success{background:var(--green)}
.btn-export{background:var(--blue);color:var(--white)}
.btn-ghost{background:var(--white)}
.btn-warn{background:var(--yellow)}

/* MAIN */
.admin-main{padding:32px 5vw 80px;max-width:1200px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat{background:var(--white);border:var(--border);box-shadow:var(--shadow);padding:18px 20px;transform:rotate(-1deg)}
.stat:nth-child(2){transform:rotate(1.5deg)}
.stat-label{display:block;font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:.1em;color:#888;margin-bottom:6px}
.stat-num{display:block;font-family:'Bungee',sans-serif;font-size:26px;color:var(--ink)}

.movie-list{display:flex;flex-direction:column;gap:16px}
.movie-item{background:var(--white);border:var(--border);box-shadow:var(--shadow);display:flex;gap:16px;padding:14px;align-items:center;transition:.15s}
.movie-item:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.movie-thumb{width:70px;height:100px;background-size:cover;background-position:center;background-color:var(--paper-2);border:2px solid var(--ink);flex-shrink:0}
.movie-info{flex:1;min-width:0}
.movie-title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.movie-title{font-family:'Bungee',sans-serif;font-size:15px}
.movie-rating{font-family:'Bungee',sans-serif;font-size:11px;background:var(--yellow);padding:2px 8px;border:2px solid var(--ink);border-radius:3px}
.movie-meta{font-size:12px;color:#666;font-weight:600}
.movie-syn{font-size:13px;color:#555;line-height:1.5;margin-top:6px;font-weight:500}
.movie-actions{display:flex;gap:8px;flex-shrink:0}
.btn-icon{width:44px;height:44px;border:var(--border);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s;background:var(--white)}
.btn-icon:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn-icon.edit{background:var(--yellow)}
.btn-icon.delete{background:var(--red);color:#fff}

.empty{text-align:center;padding:60px 20px;color:#888;font-family:'Bungee',sans-serif;font-size:14px;background:var(--white);border:3px dashed var(--ink)}

/* FORM MODAL */
.form-modal{position:fixed;inset:0;background:rgba(17,17,17,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;opacity:0;pointer-events:none;transition:.25s}
.form-modal.open{opacity:1;pointer-events:auto}
.form-box{background:var(--paper);border:4px solid var(--ink);box-shadow:14px 14px 0 var(--ink);width:min(640px,100%);max-height:90vh;overflow-y:auto;padding:28px;transform:translateY(20px);transition:.3s;position:relative}
.form-modal.open .form-box{transform:none}
.form-box h3{font-family:'Bungee',sans-serif;font-size:20px;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:.05em;color:#666}
.form-grid label.full{grid-column:1/-1}
.form-grid input,.form-grid select,.form-grid textarea{padding:11px 12px;border:3px solid var(--ink);background:var(--white);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;width:100%}
.form-grid input:focus,.form-grid textarea:focus{box-shadow:inset 0 0 0 2px var(--yellow)}
.form-grid textarea{resize:vertical;min-height:70px}
.img-preview-wrap{display:flex;justify-content:center;padding:8px 0}
.img-preview{width:200px;height:300px;background-color:var(--paper-2);background-size:cover;background-position:center;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-family:'Bungee',sans-serif;font-size:11px;color:#888}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:3px solid var(--ink)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--yellow);color:var(--ink);font-family:'Bungee',sans-serif;font-size:13px;letter-spacing:.05em;padding:14px 24px 11px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);z-index:100;opacity:0;transition:.3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:700px){
  .form-grid{grid-template-columns:1fr}
  .movie-item{flex-wrap:wrap}
  .movie-actions{width:100%;justify-content:flex-end}
  .admin-header{padding:12px 4vw}
  .brand-sm{font-size:18px;padding:5px 12px 3px}
  .subtitle,.divider{display:none}
  .btn{padding:9px 14px 7px;font-size:11px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="login-box">
    <div class="brand-big">Rx<span>!</span></div>
    <h2>ADMIN PANEL</h2>
    <input type="password" id="passInput" placeholder="Password..." autocomplete="off"
           onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">MASUK →</button>
    <p class="hint">Password default: <code>rx2025</code><br>Ubah di source code (baris <code>ADMIN_PASS</code>).</p>
  </div>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">
  <header class="admin-header">
    <div class="brand-sm">Rx<span>!</span></div>
    <span class="divider">/</span>
    <span class="subtitle">ADMIN</span>
    <div class="header-actions">
      <button class="btn btn-success" onclick="openForm()">＋ TAMBAH FILM</button>
      <button class="btn btn-warn" onclick="resetDraft()">↺ RESET</button>
      <button class="btn btn-export" onclick="exportDataJs()">⬇ EXPORT data.js</button>
      <button class="btn btn-ghost" onclick="logout()">KELUAR</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="stats">
      <div class="stat">
        <span class="stat-label">TOTAL FILM</span>
        <span class="stat-num" id="statTotal">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">STATUS</span>
        <span class="stat-num" id="statStatus" style="font-size:14px">—</span>
      </div>
    </div>
    <div id="movieList" class="movie-list"></div>
  </main>
</div>

<!-- FORM -->
<div id="formModal" class="form-modal" onclick="if(event.target===this)closeForm()">
  <div class="form-box">
    <h3 id="formTitle">TAMBAH FILM BARU</h3>
    <div class="form-grid">
      <label class="full">Judul Film
        <input type="text" id="f-title" placeholder="Contoh: Bayangan Terakhir">
      </label>
      <label>Genre
        <select id="f-genre">
          <option>Action</option><option>Drama</option><option>Thriller</option>
          <option>Horror</option><option>Sci-Fi</option><option>Romance</option>
          <option>Comedy</option><option>Adventure</option><option>Mystery</option>
        </select>
      </label>
      <label>Tahun Rilis
        <input type="number" id="f-year" placeholder="2024">
      </label>
      <label>Rating (0-10)
        <input type="number" id="f-rating" step="0.1" min="0" max="10" placeholder="8.5">
      </label>
      <label>Durasi
        <input type="text" id="f-duration" placeholder="1j 45m">
      </label>
      <label class="full">Sinopsis
        <textarea id="f-synopsis" rows="3" placeholder="Cerita singkat film..."></textarea>
      </label>
      <label class="full">Image Prompt / URL Poster
        <input type="text" id="f-img" placeholder="Deskripsi gambar (AI generate) ATAU https://url-gambar.jpg">
      </label>
      <div class="full img-preview-wrap">
        <div class="img-preview" id="imgPreview">Preview</div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeForm()">BATAL</button>
      <button class="btn btn-success" onclick="saveMovie()">💾 SIMPAN</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Load data.js -->
<script src="data.js"></script>
<script>
const ADMIN_PASS = 'rx2025';          // ← UBAH INI sebelum upload!
const STORAGE_KEY = 'rx_admin_draft'; // draft lokal
let movies = [];
let editingId = null;
let nextId = 1;

/* ---------- INIT ---------- */
function init(){
  const draft = localStorage.getItem(STORAGE_KEY);
  if(draft){
    movies = JSON.parse(draft);
    showToast('⚠ Melanjutkan draft lokal');
  } else {
    movies = JSON.parse(JSON.stringify(MOVIES || []));
  }
  nextId = Math.max(0, ...movies.map(m=>m.id||0)) + 1;
  render();
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
}

/* ---------- LOGIN ---------- */
function tryLogin(){
  const input = document.getElementById('passInput');
  if(input.value === ADMIN_PASS){
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    init();
  } else {
    showToast('❌ Password salah');
    input.value = '';
    input.focus();
  }
}

function logout(){
  if(localStorage.getItem(STORAGE_KEY)){
    if(!confirm('Ada draft yang belum di-export. Keluar tetap?')) return;
  }
  document.getElementById('panel').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('passInput').value = '';
}

/* ---------- IMAGE HELPER ---------- */
function aiImg(prompt, w, h, seed){
  if(!prompt) prompt = 'abstract movie poster cinematic';
  if(prompt.startsWith('http')) return prompt;
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&nologo=true&seed=${seed||1}`;
}

/* ---------- RENDER ---------- */
function render(){
  const list = document.getElementById('movieList');
  if(!movies.length){
    list.innerHTML = '<div class="empty">Belum ada film. Klik "Tambah Film" 👆</div>';
  } else {
    list.innerHTML = movies.map(m=>`
      <div class="movie-item">
        <div class="movie-thumb" style="background-image:url('${aiImg(m.img, 140, 200, m.id)}')"></div>
        <div class="movie-info">
          <div class="movie-title-row">
            <span class="movie-title">${escapeHtml(m.title)}</span>
            <span class="movie-rating">★ ${m.rating}</span>
          </div>
          <span class="movie-meta">${m.genre} · ${m.year} · ${m.duration}</span>
          <p class="movie-syn">${escapeHtml(m.synopsis.slice(0,100))}${m.synopsis.length>100?'...':''}</p>
        </div>
        <div class="movie-actions">
          <button class="btn-icon edit" onclick="editMovie(${m.id})" title="Edit">✏</button>
          <button class="btn-icon delete" onclick="deleteMovie(${m.id})" title="Hapus">🗑</button>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('statTotal').textContent = movies.length;
  const hasDraft = !!localStorage.getItem(STORAGE_KEY);
  const st = document.getElementById('statStatus');
  if(hasDraft){
    st.textContent = '⚠ DRAFT BELUM DI-EXPORT';
    st.style.color = 'var(--red)';
  } else {
    st.textContent = '✓ TERSIMPAN';
    st.style.color = 'var(--green)';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- FORM ---------- */
function openForm(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'TAMBAH FILM BARU';
  document.getElementById('f-title').value = '';
  document.getElementById('f-genre').value = 'Action';
  document.getElementById('f-year').value = 2024;
  document.getElementById('f-rating').value = '';
  document.getElementById('f-duration').value = '';
  document.getElementById('f-synopsis').value = '';
  document.getElementById('f-img').value = '';
  updatePreview();
  document.getElementById('formModal').classList.add('open');
  document.getElementById('f-title').focus();
}

function editMovie(id){
  const m = movies.find(x=>x.id===id);
  if(!m) return;
  editingId = id;
  document.getElementById('formTitle').textContent = 'EDIT FILM';
  document.getElementById('f-title').value = m.title;
  document.getElementById('f-genre').value = m.genre;
  document.getElementById('f-year').value = m.year;
  document.getElementById('f-rating').value = m.rating;
  document.getElementById('f-duration').value = m.duration;
  document.getElementById('f-synopsis').value = m.synopsis;
  document.getElementById('f-img').value = m.img;
  updatePreview();
  document.getElementById('formModal').classList.add('open');
}

function closeForm(){
  document.getElementById('formModal').classList.remove('open');
}

function updatePreview(){
  const val = document.getElementById('f-img').value.trim();
  const prev = document.getElementById('imgPreview');
  if(!val){
    prev.style.backgroundImage = 'none';
    prev.textContent = 'Preview';
    return;
  }
  const seed = editingId || nextId;
  prev.style.backgroundImage = `url('${aiImg(val, 300, 450, seed)}')`;
  prev.textContent = '';
}

document.getElementById('f-img').addEventListener('input', updatePreview);

function saveMovie(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ showToast('❌ Judul wajib diisi'); return; }

  const data = {
    title,
    genre: document.getElementById('f-genre').value,
    year: parseInt(document.getElementById('f-year').value) || 2024,
    rating: parseFloat(document.getElementById('f-rating').value) || 7.0,
    duration: document.getElementById('f-duration').value.trim() || '1j 30m',
    synopsis: document.getElementById('f-synopsis').value.trim() || 'Sinopsis belum diisi.',
    img: document.getElementById('f-img').value.trim() || title.toLowerCase()
  };

  if(editingId){
    const idx = movies.findIndex(m=>m.id===editingId);
    movies[idx] = {...movies[idx], ...data};
  } else {
    movies.push({id: nextId++, ...data});
  }

  persist();
  render();
  closeForm();
  showToast(editingId ? '✓ Film diupdate' : '✓ Film ditambahkan');
}

function deleteMovie(id){
  const m = movies.find(x=>x.id===id);
  if(!m) return;
  if(!confirm(`Hapus "${m.title}"?`)) return;
  movies = movies.filter(x=>x.id!==id);
  persist();
  render();
  showToast('🗑 Film dihapus');
}

function resetDraft(){
  if(!localStorage.getItem(STORAGE_KEY)){ showToast('Tidak ada draft untuk direset'); return; }
  if(!confirm('Batalkan semua perubahan dan kembali ke data.js asli?')) return;
  localStorage.removeItem(STORAGE_KEY);
  movies = JSON.parse(JSON.stringify(MOVIES || []));
  nextId = Math.max(0, ...movies.map(m=>m.id||0)) + 1;
  render();
  showToast('↺ Draft direset');
}

/* ---------- EXPORT ---------- */
function exportDataJs(){
  const header =
`// ============================================
// Rx! — Data Film
// Diedit via admin.html
// Tanggal export: ${new Date().toLocaleString('id-ID')}
// Total film: ${movies.length}
// ============================================

`;
  const body = 'const MOVIES = ' + JSON.stringify(movies, null, 2) + ';\n';
  download('data.js', header + body, 'text/javascript');

  // Setelah export, hapus draft → status kembali "TERSIMPAN"
  localStorage.removeItem(STORAGE_KEY);
  render();
  showToast('⬇ data.js diunduh! Replace di GitHub.');
}

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 100);
}

/* ---------- TOAST ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

/* ---------- SHORTCUTS ---------- */
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeForm();
});
</script>
</body>
</html>
